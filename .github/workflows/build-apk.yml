name: Build Mera Bazaar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app with Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build APK - attempt 1
        id: build1
        continue-on-error: true
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Wait before retry
        if: steps.build1.outcome == 'failure'
        run: sleep 60

      - name: Build APK - attempt 2
        id: build2
        continue-on-error: true
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Wait before final retry
        if: steps.build2.outcome == 'failure'
        run: sleep 120

      - name: Build APK - final attempt
        if: steps.build2.outcome == 'failure'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mera-bazaar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
